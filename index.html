<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#122A22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دليل الطلاب">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>دليل الطلاب — عبدالرحمن بن عوف الابتدائية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Noto+Kufi+Arabic:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#122A22;
    --ink-2:#1E4438;
    --ink-3:#295A49;
    --paper:#FBF9F3;
    --paper-2:#F1ECDB;
    --accent:#AD7C2A;
    --accent-2:#E3C077;
    --gold:#AD7C2A;
    --gold-light:#E3C077;
    --line:#E7E0CA;
    --danger:#B3261E;
    --muted:#7C8179;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,.kufi{font-family:'IBM Plex Sans Arabic', system-ui, sans-serif;}
  .ornate{font-family:'Aref Ruqaa', serif;}
  button{font-family:inherit;}
  input, select{font-family:inherit;}

  @keyframes riseIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .hero-pattern{
    position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:
      repeating-linear-gradient(45deg, rgba(227,192,119,.08) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(-45deg, rgba(227,192,119,.06) 0 1px, transparent 1px 22px);
  }

  /* ---------- Gate ---------- */
  #gate{
    position:fixed; inset:0;
    background:radial-gradient(120% 90% at 50% -10%, var(--ink-3) 0%, var(--ink) 60%);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px; padding:24px; z-index:100;
    color:var(--paper); text-align:center; overflow:hidden;
  }
  #gate .badge{
    width:66px; height:66px; border-radius:20px;
    background:rgba(227,192,119,.12); border:1px solid rgba(227,192,119,.3);
    display:flex; align-items:center; justify-content:center; margin-bottom:4px;
    animation:riseIn .5s ease both;
  }
  #gate .badge svg{width:30px;height:30px;}
  #gate .gate-school{
    font-family:'Aref Ruqaa', serif; font-weight:700; font-size:30px; line-height:1.4;
    background:linear-gradient(90deg, var(--gold-light), var(--gold));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    margin:0; max-width:320px; animation:riseIn .55s ease .05s both;
  }
  #gate .gate-sub{
    color:#aab8ae; margin:0; font-size:13.5px; animation:riseIn .55s ease .1s both;
  }
  #gate input{
    width:100%; max-width:260px; padding:14px 16px; border-radius:12px;
    border:1px solid rgba(227,192,119,.25); background:rgba(255,255,255,.06); color:var(--paper);
    font-size:18px; text-align:center; letter-spacing:4px; margin-top:8px;
    animation:riseIn .55s ease .15s both;
  }
  #gate input::placeholder{color:#8b9a90; letter-spacing:normal;}
  #gate button{
    width:100%; max-width:260px; padding:14px; border-radius:12px; border:none;
    background:linear-gradient(90deg, var(--gold-light), var(--gold)); color:var(--ink);
    font-weight:700; font-size:15px; cursor:pointer;
    animation:riseIn .55s ease .2s both;
    box-shadow:0 8px 20px -6px rgba(173,124,42,.55);
  }
  #gate .err{color:#ff9b9b; font-size:13px; min-height:16px;}

  /* ---------- App shell ---------- */
  #app{display:none; min-height:100%; flex-direction:column;}
  header.top{
    position:relative; overflow:hidden; z-index:11;
    background:radial-gradient(130% 160% at 100% -30%, var(--ink-3) 0%, var(--ink) 55%);
    color:var(--paper);
    padding:calc(env(safe-area-inset-top) + 18px) 18px 30px;
  }
  header.top .row{position:relative; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  header.top .school-name{
    font-family:'Aref Ruqaa', serif; font-weight:700; font-size:23px; line-height:1.5;
    background:linear-gradient(90deg, var(--gold-light), var(--gold));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  header.top .app-sub{font-size:12px; color:#a9b7ac; margin-top:3px;}
  header.top .count{
    position:relative; font-size:12px; color:var(--gold-light);
    background:rgba(227,192,119,.12); border:1px solid rgba(227,192,119,.28);
    padding:5px 12px; border-radius:999px; white-space:nowrap; margin-top:2px;
  }

  .search-bar{
    position:sticky; z-index:9; top:0;
    background:var(--paper); padding:0 16px 10px;
    margin-top:-18px;
  }
  .search-bar .box{
    display:flex; align-items:center; gap:8px;
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:13px 15px; box-shadow:0 10px 26px -14px rgba(18,42,34,.35);
  }
  .search-bar svg{width:18px;height:18px; flex:none; color:var(--muted);}
  .search-bar input{
    border:none; outline:none; background:transparent; width:100%;
    font-size:15px; color:var(--ink);
  }
  .search-bar input::placeholder{color:#9aa0ab;}
  .chips{display:flex; gap:8px; margin-top:12px; overflow-x:auto; padding-bottom:2px;}
  .chip{
    flex:none; padding:7px 15px; border-radius:999px; font-size:13px;
    border:1px solid var(--line); background:#fff; color:var(--ink-2); cursor:pointer;
    transition:transform .15s ease;
  }
  .chip:active{transform:scale(.95);}
  .chip.active{
    background:linear-gradient(90deg, var(--gold-light), var(--gold));
    border-color:transparent; color:var(--ink); font-weight:600;
    box-shadow:0 6px 16px -8px rgba(173,124,42,.6);
  }

  main{flex:1; padding:4px 16px 40px;}

  .group-title{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:18px 2px 7px; font-weight:600; font-size:14px; color:var(--ink-2);
  }
  .group-title span.n{font-weight:400; font-size:12px; color:var(--muted);}

  ul.roster{list-style:none; margin:0; padding:0; border-top:1px solid var(--line);}
  ul.roster li{
    display:flex; align-items:center; gap:12px;
    padding:12px 2px; border-bottom:1px solid var(--line);
    cursor:pointer; transition:background .12s ease, transform .12s ease;
  }
  ul.roster li:active{background:var(--paper-2); transform:scale(.99);}
  .idx{
    flex:none; width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:var(--accent);
    background:var(--paper-2); border:1.3px solid rgba(173,124,42,.35);
  }
  .name-block{flex:1; min-width:0;}
  .name-block .nm{font-size:15.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .name-block .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .tag{
    flex:none; font-size:11px; padding:4px 10px; border-radius:999px;
    background:var(--paper-2); color:var(--ink-2); border:1px solid var(--line);
    white-space:nowrap;
  }
  .chev{flex:none; color:#c3c6b8; width:16px; height:16px;}

  .empty{padding:60px 20px; text-align:center; color:var(--muted);}
  .empty .big{font-size:15px; color:var(--ink); margin-bottom:6px; font-weight:600;}

  /* ---------- Detail panel ---------- */
  #detail{
    position:fixed; inset:0; background:var(--paper); z-index:50;
    display:none; flex-direction:column; transform:translateY(100%);
    transition:transform .3s cubic-bezier(.22,.9,.3,1);
  }
  #detail.open{display:flex; transform:translateY(0);}
  .d-head{
    position:relative; overflow:hidden;
    background:radial-gradient(130% 160% at 100% -30%, var(--ink-3) 0%, var(--ink) 55%);
    color:var(--paper);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 24px;
  }
  .d-back{
    position:relative; top:0; margin-bottom:14px;
    background:rgba(255,255,255,.1); border:none; color:var(--paper);
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .d-back svg{width:18px;height:18px;}
  .d-name{position:relative; font-size:20px; margin:0 0 6px; font-weight:700;}
  .d-tag{
    position:relative; display:inline-block; font-size:12px; padding:6px 13px; border-radius:999px;
    background:rgba(227,192,119,.16); color:var(--gold-light); border:1px solid rgba(227,192,119,.35);
  }
  .d-body{flex:1; overflow-y:auto; padding:18px 16px 100px;}
  .field{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-bottom:12px;
  }
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px;}
  .field .val{font-size:16px; color:var(--ink); font-weight:600; word-break:break-all;}
  .field .val a{color:var(--ink-3); text-decoration:none;}
  .field input, .field select{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:15px; color:var(--ink); background:var(--paper);
  }
  .actions-row{display:flex; gap:8px; margin-top:10px;}
  .actions-row a.call, .actions-row a.wa{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    text-align:center; padding:11px; border-radius:12px; font-size:13.5px;
    text-decoration:none; font-weight:600; border:1px solid var(--line);
  }
  .actions-row a.call{background:var(--ink-3); color:#fff; border-color:var(--ink-3);}
  .actions-row a.wa{background:#fff; color:var(--ink-2);}
  .actions-row svg{width:15px;height:15px;}

  .d-footer{
    position:fixed; bottom:0; right:0; left:0; padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);
    background:linear-gradient(to top, var(--paper) 60%, transparent);
  }
  .btn{
    width:100%; padding:14px; border-radius:14px; border:none; font-size:15px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn.primary{background:var(--ink-3); color:#fff;}
  .btn.save{background:linear-gradient(90deg, var(--gold-light), var(--gold)); color:var(--ink); box-shadow:0 8px 20px -8px rgba(173,124,42,.55);}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}
  .btn.ghost{background:#fff; border:1px solid var(--line); color:var(--ink-2);}

  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:12px;
    font-size:14px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:200;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  ::selection{background:var(--gold-light); color:var(--ink);}
</style>
</head>
<body>

<div id="gate">
  <div class="hero-pattern"></div>
  <div class="badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="#E3C077" stroke-width="2" stroke-linecap="round"><path d="M4 6h11M4 12h8M4 18h6"/><circle cx="20" cy="6" r="1.3" fill="#E3C077" stroke="none"/><circle cx="16" cy="12" r="1.3" fill="#E3C077" stroke="none"/><circle cx="14" cy="18" r="1.3" fill="#E3C077" stroke="none"/></svg>
  </div>
  <h1 class="gate-school">عبدالرحمن بن عوف الابتدائية</h1>
  <p class="gate-sub">دليل الطلاب</p>
  <input id="gate-pass" type="password" inputmode="numeric" placeholder="كلمة المرور">
  <button id="gate-btn">دخول</button>
  <div class="err" id="gate-err"></div>
</div>

<div id="app">
  <header class="top">
    <div class="hero-pattern"></div>
    <div class="row">
      <div>
        <h1 class="school-name">عبدالرحمن بن عوف الابتدائية</h1>
        <div class="app-sub">دليل الطلاب</div>
      </div>
      <div class="count" id="total-count">—</div>
    </div>
  </header>

  <div class="search-bar">
    <div class="box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="ابحث بالاسم، رقم الهوية، أو الجوال…" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <main>
    <div id="list-wrap"></div>
  </main>
</div>

<div id="detail">
  <div class="d-head">
    <div class="hero-pattern"></div>
    <button class="d-back" id="d-close" aria-label="رجوع">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="d-name" id="d-name"></div>
    <span class="d-tag" id="d-class"></span>
  </div>
  <div class="d-body" id="d-body-view">
    <div class="field">
      <label>المرحلة</label>
      <div class="val" id="d-grade"></div>
    </div>
    <div class="field">
      <label>الفصل</label>
      <div class="val" id="d-section"></div>
    </div>
    <div class="field">
      <label>رقم الهوية</label>
      <div class="val" id="d-id"></div>
    </div>
    <div class="field">
      <label>جوال ولي الأمر</label>
      <div class="val"><a id="d-phone-link" href="#"></a></div>
      <div class="actions-row">
        <a class="call" id="d-call" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          اتصال
        </a>
        <a class="wa" id="d-wa" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.32A8.86 8.86 0 0 0 12.02 3.5c-4.9 0-8.9 4-8.9 8.9 0 1.57.41 3.1 1.19 4.44L3 21l4.28-1.12a8.9 8.9 0 0 0 4.74 1.36h0c4.9 0 8.9-4 8.9-8.9a8.86 8.86 0 0 0-3.32-5.02zM12.02 19.4a7.4 7.4 0 0 1-3.77-1.03l-.27-.16-2.8.73.75-2.73-.18-.28a7.4 7.4 0 1 1 6.27 3.47zm4.08-5.55c-.22-.11-1.32-.65-1.53-.73-.2-.08-.35-.11-.5.11-.15.22-.58.73-.71.88-.13.15-.26.16-.48.05-.22-.11-.94-.35-1.79-1.11-.66-.59-1.11-1.32-1.24-1.54-.13-.22-.01-.34.1-.45.1-.1.22-.26.33-.39.11-.13.15-.22.22-.37.07-.15.04-.28-.02-.39-.06-.11-.5-1.21-.69-1.66-.18-.43-.36-.37-.5-.38-.13-.01-.28-.01-.43-.01-.15 0-.39.06-.6.28-.2.22-.79.77-.79 1.87 0 1.1.81 2.17.92 2.32.11.15 1.6 2.44 3.87 3.42.54.23.96.37 1.29.48.54.17 1.04.15 1.43.09.44-.07 1.32-.54 1.5-1.06.19-.52.19-.96.13-1.06-.06-.09-.2-.15-.42-.26z"/></svg>
          واتساب
        </a>
      </div>
    </div>
  </div>
  <div class="d-body" id="d-body-edit" style="display:none;">
    <div class="field">
      <label>اسم الطالب</label>
      <input id="e-name" type="text">
    </div>
    <div class="field">
      <label>المرحلة</label>
      <select id="e-grade"></select>
    </div>
    <div class="field">
      <label>الفصل</label>
      <select id="e-section"></select>
    </div>
    <div class="field">
      <label>رقم الهوية</label>
      <input id="e-id" type="text" inputmode="numeric">
    </div>
    <div class="field">
      <label>جوال ولي الأمر</label>
      <input id="e-phone" type="tel" inputmode="tel">
    </div>
  </div>
  <div class="d-footer">
    <button class="btn primary" id="d-edit-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      تعديل البيانات
    </button>
    <div class="btn-row" id="d-edit-actions" style="display:none;">
      <button class="btn ghost" id="d-cancel-btn">إلغاء</button>
      <button class="btn save" id="d-save-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M20 6L9 17l-5-5"/></svg>
        <span id="d-save-label">حفظ</span>
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = "https://hqppacntsggeyxfkobjn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxcHBhY250c2dnZXl4ZmtvYmpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5Mjg1NjYsImV4cCI6MjA5MDUwNDU2Nn0.i2kNNTgI7JgJ7bN1Sudie543s_84YYDuPc9rqbSoXJY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const GATE_PASS = "2030";
const gate = document.getElementById('gate');
const app = document.getElementById('app');

function tryEnter(){
  const val = document.getElementById('gate-pass').value.trim();
  if(val === GATE_PASS){
    localStorage.setItem('sd_auth_ok','1');
    gate.style.display='none';
    app.style.display='flex';
    boot();
  } else {
    document.getElementById('gate-err').textContent = 'كلمة المرور غير صحيحة';
  }
}
document.getElementById('gate-btn').addEventListener('click', tryEnter);
document.getElementById('gate-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') tryEnter(); });

if(localStorage.getItem('sd_auth_ok') === '1'){
  gate.style.display='none';
  app.style.display='flex';
  boot();
}

let ALL = [];
let activeGrade = 'all';
let CLASS_OPTIONS = [];

const GRADE_ORDER = {'الأول':1,'الثاني':2,'الثالث':3,'الرابع':4,'الخامس':5,'السادس':6};
const GRADE_DISPLAY = {'الأول':'الأول ابتدائي','الثاني':'الثاني ابتدائي','الثالث':'الثالث ابتدائي','الرابع':'الرابع ابتدائي','الخامس':'الخامس ابتدائي','السادس':'السادس ابتدائي'};

function gradeOf(row){
  return (row.class_label||'').split(' - ')[0];
}
function gradeDisplay(key){
  return GRADE_DISPLAY[key] || key;
}
function labelDisplay(label){
  const [g, ...rest] = (label||'').split(' - ');
  return [gradeDisplay(g), ...rest].join(' - ');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function boot(){
  const {data, error} = await sb.from('students').select('*').order('class_grade').order('class_section').order('student_name');
  if(error){
    document.getElementById('list-wrap').innerHTML = `<div class="empty"><div class="big">تعذر تحميل البيانات</div>${error.message}</div>`;
    return;
  }
  ALL = data;
  document.getElementById('total-count').textContent = ALL.length + ' طالب';

  const grades = [...new Set(ALL.map(gradeOf))].sort((a,b)=>(GRADE_ORDER[a]||9)-(GRADE_ORDER[b]||9));
  CLASS_OPTIONS = [...new Set(ALL.map(r=>r.class_label))].sort((a,b)=>{
    const [ga,sa]=a.split(' - الفصل '); const [gb,sb]=b.split(' - الفصل ');
    if(ga!==gb) return (GRADE_ORDER[ga]||9)-(GRADE_ORDER[gb]||9);
    return parseInt(sa)-parseInt(sb);
  });

  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className='chip active'; allChip.textContent='الكل'; allChip.dataset.g='all';
  chips.appendChild(allChip);
  grades.forEach(g=>{
    const c = document.createElement('div');
    c.className='chip'; c.textContent=gradeDisplay(g); c.dataset.g=g;
    chips.appendChild(c);
  });
  chips.addEventListener('click', e=>{
    const chip = e.target.closest('.chip');
    if(!chip) return;
    [...chips.children].forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeGrade = chip.dataset.g;
    render();
  });

  document.getElementById('search').addEventListener('input', render);
  render();
}

function render(){
  const q = document.getElementById('search').value.trim();
  const wrap = document.getElementById('list-wrap');

  let rows = ALL;
  if(activeGrade !== 'all') rows = rows.filter(r => gradeOf(r) === activeGrade);

  if(q){
    const nq = q.replace(/\s+/g,'');
    rows = rows.filter(r =>
      (r.student_name||'').includes(q) ||
      (r.student_id||'').includes(nq) ||
      (r.guardian_mobile||'').includes(nq) ||
      (r.class_label||'').includes(q) ||
      labelDisplay(r.class_label).includes(q)
    );
    wrap.innerHTML = '';
    if(rows.length===0){
      wrap.innerHTML = `<div class="empty"><div class="big">لا توجد نتائج</div>جرّب اسمًا أو رقمًا مختلفًا</div>`;
      return;
    }
    const ul = document.createElement('ul');
    ul.className='roster';
    rows.forEach((r,i)=> ul.appendChild(rowEl(r, i+1)));
    wrap.appendChild(ul);
    return;
  }

  // grouped by class
  wrap.innerHTML = '';
  if(rows.length===0){
    wrap.innerHTML = `<div class="empty"><div class="big">لا يوجد طلاب</div></div>`;
    return;
  }
  const groups = {};
  rows.forEach(r=>{
    (groups[r.class_label] = groups[r.class_label] || []).push(r);
  });
  const order = CLASS_OPTIONS.filter(c => groups[c]);
  order.forEach(label=>{
    const gTitle = document.createElement('div');
    gTitle.className='group-title';
    gTitle.innerHTML = `<span>${labelDisplay(label)}</span><span class="n">${groups[label].length} طالب</span>`;
    wrap.appendChild(gTitle);
    const ul = document.createElement('ul');
    ul.className='roster';
    groups[label].forEach((r,i)=> ul.appendChild(rowEl(r, i+1, true)));
    wrap.appendChild(ul);
  });
}

function rowEl(r, idx, hideTag){
  const li = document.createElement('li');
  li.innerHTML = `
    <div class="idx">${idx}</div>
    <div class="name-block">
      <div class="nm">${r.student_name}</div>
      <div class="sub">${r.student_id}</div>
    </div>
    ${hideTag ? '' : `<div class="tag">${labelDisplay(r.class_label)}</div>`}
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  `;
  li.addEventListener('click', ()=> openDetail(r.id));
  return li;
}

let currentRow = null;
const detail = document.getElementById('detail');

function openDetail(id){
  currentRow = ALL.find(r=>r.id===id);
  if(!currentRow) return;
  fillView(currentRow);
  exitEdit();
  detail.classList.add('open');
}
document.getElementById('d-close').addEventListener('click', ()=>{
  detail.classList.remove('open');
});

function fillView(r){
  document.getElementById('d-name').textContent = r.student_name;
  document.getElementById('d-class').textContent = labelDisplay(r.class_label);
  document.getElementById('d-grade').textContent = gradeDisplay(gradeOf(r));
  document.getElementById('d-section').textContent = 'الفصل ' + (r.class_section || (r.class_label||'').split(' - الفصل ')[1] || '');
  document.getElementById('d-id').textContent = r.student_id;
  const phone = r.guardian_mobile || '';
  const link = document.getElementById('d-phone-link');
  link.textContent = phone ? '+'+phone : '—';
  link.href = phone ? 'tel:+'+phone : '#';
  document.getElementById('d-call').href = phone ? 'tel:+'+phone : '#';
  document.getElementById('d-wa').href = phone ? 'https://wa.me/'+phone : '#';
}

function exitEdit(){
  document.getElementById('d-body-view').style.display='block';
  document.getElementById('d-body-edit').style.display='none';
  document.getElementById('d-edit-btn').style.display='block';
  document.getElementById('d-edit-actions').style.display='none';
}

document.getElementById('d-edit-btn').addEventListener('click', ()=>{
  const r = currentRow;
  document.getElementById('e-name').value = r.student_name || '';
  document.getElementById('e-id').value = r.student_id || '';
  document.getElementById('e-phone').value = r.guardian_mobile || '';

  const grades = Object.keys(GRADE_ORDER);
  const gSel = document.getElementById('e-grade');
  gSel.innerHTML = grades.map(g=>`<option value="${g}" ${g===gradeOf(r)?'selected':''}>${gradeDisplay(g)}</option>`).join('');

  const sections = ['1','2','3'];
  const curSection = r.class_section || (r.class_label||'').split(' - الفصل ')[1] || '1';
  const sSel = document.getElementById('e-section');
  sSel.innerHTML = sections.map(s=>`<option value="${s}" ${s===String(curSection)?'selected':''}>الفصل ${s}</option>`).join('');

  document.getElementById('d-body-view').style.display='none';
  document.getElementById('d-body-edit').style.display='block';
  document.getElementById('d-edit-btn').style.display='none';
  document.getElementById('d-edit-actions').style.display='flex';
});

document.getElementById('d-cancel-btn').addEventListener('click', ()=>{
  fillView(currentRow);
  exitEdit();
});

document.getElementById('d-save-btn').addEventListener('click', async ()=>{
  const r = currentRow;
  const newName = document.getElementById('e-name').value.trim();
  const newId = document.getElementById('e-id').value.trim();
  const newPhone = document.getElementById('e-phone').value.trim();
  const newGrade = document.getElementById('e-grade').value;
  const sec = document.getElementById('e-section').value;
  const newClass = `${newGrade} - الفصل ${sec}`;
  if(!newName || !newId){
    toast('الاسم ورقم الهوية مطلوبان');
    return;
  }
  const gradeCodeMap = {'الأول':'01','الثاني':'02','الثالث':'03','الرابع':'04','الخامس':'05','السادس':'06'};
  const newGradeCode = (gradeCodeMap[newGrade]||'00') + '30';

  const btn = document.getElementById('d-save-btn');
  const label = document.getElementById('d-save-label');
  btn.disabled = true; label.textContent = 'جارٍ الحفظ…';

  const {data, error} = await sb.from('students')
    .update({
      student_name:newName,
      student_id:newId,
      guardian_mobile:newPhone,
      class_label:newClass,
      class_grade:newGradeCode,
      class_section:sec,
      updated_at:new Date().toISOString()
    })
    .eq('id', r.id)
    .select();

  btn.disabled = false; label.textContent = 'حفظ';

  if(error){
    toast('تعذر الحفظ: ' + error.message);
    return;
  }
  Object.assign(r, data[0]);
  fillView(r);
  exitEdit();
  render();
  toast('تم حفظ التعديلات');
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
